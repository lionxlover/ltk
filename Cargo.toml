[workspace]
resolver = "2"
members = [
    "crates/ltk-core",
    "crates/ltk-design",
    "crates/ltk-layout",
    "crates/ltk-render",
    "crates/ltk-input",
    "crates/ltk-event",
    "crates/ltk-animation",
    "crates/ltk-state",
    "crates/ltk-resources",
    "crates/ltk-locale",
    "crates/ltk-a11y",
    "crates/ltk-window",
    "crates/ltk-platform",
    "crates/ltk-perf",
    "crates/ltk-security",
    "crates/ltk-devtools",
    "crates/ltk-testing",
    "crates/ltk-plugin",
    "crates/ltk-wayland",
    "crates/ltk-gl",
    "crates/ltk-vk",
]

[workspace.package]
version     = "1.0.0"
edition     = "2021"
authors     = ["Lion <lion@lionos.dev>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/lionos/ltk"
homepage    = "https://ltk.lionos.dev"
description = "LTK — Lion Tool Kit: The native UI framework of LionOS"
rust-version = "1.78"

[workspace.dependencies]
# Core async
tokio          = { version = "1",  features = ["full"] }
async-trait    = "0.1"
# Serialisation
serde          = { version = "1",  features = ["derive"] }
serde_json     = "1"
toml           = "0.8"
# Maths / geometry
glam           = "0.27"
euclid         = "0.22"
# Graphics
wgpu           = "0.20"
glutin         = "0.31"
# Wayland
wayland-client = "0.31"
wayland-protocols = "0.31"
# Accessibility
atspi          = "0.19"
# Concurrency
parking_lot    = "0.12"
arc-swap       = "1"
crossbeam      = "0.8"
# Utilities
log            = "0.4"
tracing        = "0.1"
thiserror      = "1"
anyhow         = "1"
bitflags       = "2"
once_cell      = "1"
indexmap       = "2"
smallvec       = "1"
tinyvec        = "1"
slotmap        = "1"
# UI
slint          = "1.4"
slint-build    = "1.4"
# Text
fontdb         = "0.18"
rustybuzz      = "0.13"
cosmic-text    = "0.11"
unicode-bidi   = "0.3"
unicode-segmentation = "1"
# Image
image          = "0.25"
resvg          = "0.41"
# Scripting/plugins
wasmtime       = { version = "20", optional = true }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
