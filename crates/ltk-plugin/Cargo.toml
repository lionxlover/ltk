[package]
name        = "ltk-plugin"
description = "LTK plugin system: WASM sandbox, component registry, service DI"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
ltk-core  = { path = "../ltk-core" }
ltk-event = { path = "../ltk-event" }
ltk-state = { path = "../ltk-state" }
serde     = { workspace = true, features = ["derive"] }
log       = { workspace = true }
wasmtime  = { workspace = true, optional = true }

[features]
default = []
wasm    = ["dep:wasmtime"]
